name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "===== WHO AM I ====="
          whoami
          id
          echo "===== PATHS ====="
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD=$(pwd)"
          echo "===== OWNERSHIP ====="
          ls -ld "$GITHUB_WORKSPACE" || echo "cannot stat GITHUB_WORKSPACE"
          ls -ld "$HOME" || echo "cannot stat HOME"
          echo "===== WRITE TEST ====="
          mkdir -p "$GITHUB_WORKSPACE/.writetest" && echo "workspace writable" || echo "workspace NOT writable"
          mkdir -p "$HOME/.writetest" && echo "home writable" || echo "home NOT writable"

      - name: Copy project files to server
        run: |
          # Use the workspace dir instead of ~/.ssh to avoid HOME/permission issues
          KEYDIR="$GITHUB_WORKSPACE/.deploy-ssh"
          mkdir -p "$KEYDIR"
          chmod 700 "$KEYDIR"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$KEYDIR/deploy_key"
          chmod 600 "$KEYDIR/deploy_key"
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" > "$KEYDIR/known_hosts" 2>/dev/null || true

          SSH="ssh -i $KEYDIR/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o UserKnownHostsFile=$KEYDIR/known_hosts -o StrictHostKeyChecking=accept-new"
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # Ensure target dir exists on the server
          $SSH "$HOST" 'mkdir -p /opt/rooli-marketing'

          # Ship code; --no-same-owner stops tar from stamping runner UID (1001) onto files/dirs
          tar czf - \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='env' \
            --exclude='__pycache__' \
            . | $SSH "$HOST" 'tar xzf - --no-same-owner --no-overwrite-dir -C /opt/rooli-marketing'

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/rooli-marketing

            if [ ! -f .env ]; then
              echo "ERROR: .env missing in /opt/rooli-marketing. Create it once with your secrets, then re-run." >&2
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            $COMPOSE pull redis || true
            $COMPOSE up -d --build
            docker image prune -f

            $COMPOSE ps