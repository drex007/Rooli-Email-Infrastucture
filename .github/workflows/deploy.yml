name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project files to server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new"
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # Ensure target dir exists on the server
          $SSH "$HOST" 'mkdir -p /opt/rooli-marketing'

          # Ship code; --no-same-owner stops tar from stamping runner UID (1001) onto files/dirs
          tar czf - \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='env' \
            --exclude='__pycache__' \
            . | $SSH "$HOST" 'tar xzf - --no-same-owner --no-overwrite-dir -C /opt/rooli-marketing'

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /opt/rooli-marketing

            if [ ! -f .env ]; then
              echo "ERROR: .env missing in /opt/rooli-marketing. Create it once with your secrets, then re-run." >&2
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            $COMPOSE pull redis || true
            $COMPOSE up -d --build
            docker image prune -f

            $COMPOSE ps