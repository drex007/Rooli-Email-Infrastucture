name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project files to server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new"
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # Ship code to the server's home dir (tar over ssh = only needs tar + ssh).
          # .env is excluded so the server's secrets are never overwritten.
          tar czf - \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='env' \
            --exclude='__pycache__' \
            . | $SSH "$HOST" 'tar xzf - -C "$HOME"'

      - name: Build and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # Build in the login user's home directory
            cd "$HOME"

            # .env holds secrets and is NOT shipped from the repo — create it once on the server
            if [ ! -f .env ]; then
              echo "ERROR: .env missing in $HOME. Create it once with your secrets, then re-run." >&2
              exit 1
            fi

            # Pick the compose command available on the host
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            # Rebuild and restart, then prune dangling images
            $COMPOSE pull redis || true
            $COMPOSE up -d --build
            docker image prune -f

            $COMPOSE ps
