name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # Project lives directly in the login user's home directory
            cd "$HOME"

            # The repo must already be cloned here (one-time manual setup)
            if [ ! -d ".git" ]; then
              echo "ERROR: $HOME is not a git repo. Clone the project here and add .env first." >&2
              exit 1
            fi
            git fetch --all --prune
            git reset --hard origin/main

            # Pick the compose command available on the host
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            # Rebuild and restart, then prune dangling images
            $COMPOSE pull redis || true
            $COMPOSE up -d --build
            docker image prune -f

            $COMPOSE ps
